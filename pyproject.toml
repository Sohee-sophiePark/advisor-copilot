[project]
name = "advisor-copilot"
version = "0.1.0"
description = "Multi-agent wealth-advisor copilot with a hand-built agent harness. Synthetic data, demo only."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "sse-starlette>=2.1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "google-genai>=1.0",
]

[project.scripts]
advisor-copilot = "advisor_copilot.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "ruff>=0.5",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisor_copilot"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# SQL schema and synthetic data tables: structured blocks, kept on one line each
"src/advisor_copilot/db.py" = ["E501"]
"data/generate_book.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["advisor_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["evals"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
